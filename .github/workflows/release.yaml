# $schema: https://json.schemastore.org/github-workflow.json

name: add package to release
on:
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  add-package-to-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make artifact name
        id: artifact_name
        run: |-
          jq -r '"tree-sitter-aiscript-" + .version | "name=" + .' ./package.json >> "$GITHUB_OUTPUT"
      - name: call build
        uses: ./.github/workflows/build.yaml@develop
        with:
          do_upload: true
          artifact_name: ${{ steps.artifact_name.outputs.name }}
          ref: ${{ github.ref }}
      - name: get result
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ./out/
      - name: add artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ github.ref_name }}
        run: |-
          gh release upload "$target" ./out/*.tgz
